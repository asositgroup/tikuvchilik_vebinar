  .thx__brand{ font-family:'Playfair Display',serif; font-weight:700; font-size:20px; letter-spacing:3px;

  .thx__badge{ display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:700;

  .thx__title{ font-family:'Playfair Display',serif; font-weight:800; font-size:clamp(30px,9vw,44px);

  .thx__arrow{ width:34px; height:34px; fill:none; stroke:var(--burgundy); stroke-width:1.8; stroke-linecap:round;

  @keyframes thxbob{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(6px) } }
  .thx__btn{ display:inline-flex; align-items:center; justify-content:center; gap:11px; width:100%; max-width:360px;
    font-family:'Montserrat',sans-serif; font-weight:800; font-size:18px; letter-spacing:.6px; text-transform:uppercase;
    color:#fff; text-decoration:none; background:linear-gradient(180deg,#33ade6,#1c8fd0 58%,#1580c4);
    border-radius:16px; padding:20px 24px; box-shadow:0 16px 36px -14px rgba(41,150,214,.9);
    transition:transform .16s, filter .16s; }
  .thx__btn:hover{ transform:translateY(-2px); filter:brightness(1.06); }
  .thx__plane{ width:22px; height:22px; fill:none; stroke:#fff; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .thx__note{ font-size:12.5px; color:var(--ink-soft); margin-top:14px; max-width:34ch; }
  .thx__foot{ font-size:12px; color:var(--ink-soft); margin-top:auto; padding-top:30px; }
